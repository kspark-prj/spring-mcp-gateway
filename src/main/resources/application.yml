server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: spring-mcp-gateway
  lifecycle:
    timeout-per-shutdown-phase: 35s
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/mcp_gateway
    username: mcp_user
    password: mcp_password
    pool:
      initial-size: 5
      max-size: 20
      max-idle-time: 30m
  flyway:
    enabled: true
    url: jdbc:postgresql://localhost:5432/mcp_gateway
    user: mcp_user
    password: mcp_password
    baseline-on-migrate: true

mcp:
  gateway:
    master-key: "mcp-gateway-master-key-2026"
    tsid:
      node-id: ${TSID_NODE_ID:0} # 환경변수가 없으면 기본값 0 사용 (클러스터 모드 시 인스턴스별 고유값 필수)
    admin:
      username: "admin"
      password: "admin1"
    cache:
      maximum-size: 2000
    upstream:
      read-timeout-ms: 30000
      connect-timeout-ms: 5000

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
    instances:
      # 서버 이름(예: local_test)별로 서킷브레이커 인스턴스 지정
      local_test:
        baseConfig: default

logging:
  level:
    root: INFO
    com.mcp.gateway: DEBUG
    org.springframework.security: INFO
    org.springframework.data.r2dbc: ERROR
    org.springframework.r2dbc: ERROR
    io.r2dbc: ERROR